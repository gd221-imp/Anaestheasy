body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:0 160px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--des);outline-offset:3px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin-right:auto}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.stat{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.stat svg{width:20px;height:20px}
.menu-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* stage banner */
.stage{margin-top:28px;border-radius:18px;padding:16px 18px;background:var(--c);color:#fff;box-shadow:0 5px 0 var(--cd);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;scroll-margin-top:80px}
.stage.c5{color:#2a2000}
.stage .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.stage h2{grid-column:1;margin:0;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1;text-wrap:balance}
.stage p{grid-column:1;margin:0;font-size:14px;opacity:.9}
.stage .ring{grid-row:1/4;grid-column:2;width:58px;height:58px}
.stage .ring text{font-family:var(--mono);font-size:13px;fill:currentColor}

/* path */
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:28px 8px}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x))}
.node{width:76px;height:72px;border-radius:50%;border:0;background:var(--c);box-shadow:0 7px 0 var(--cd);display:grid;place-items:center;color:#fff;transition:transform .1s, box-shadow .1s;position:relative}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.c5 .node,.node.c5{color:#2a2000}
.node.shaped{width:80px;height:88px;background:none;box-shadow:none;border-radius:0;position:relative;display:block;padding:0}

const COMP_CARD={h:"Competition ratios",b:`<p>Applications per post in England (round 1 CT1, includes ACCS Anaesthetics; round 2 ST3, then ST4). Hover over a point for the numbers, or open the table below.</p><div class="crlegend"><span><i class="crk1"></i>CT1</span><span><i class="crk2"></i>ST4</span><span><i class="crk2o"></i>ST3 (until 2021)</span></div><svg viewBox="0 0 340 210" class="crsvg" role="img" aria-label="Anaesthetics competition ratios 2019 to 2025: CT1 rose from 2.4 to 12.6 applications per post; ST3 then ST4 stayed between 1.5 and 2.7"><line x1="30" x2="262" y1="184.0" y2="184.0" class="crg"/><text x="24" y="187.5" class="crt" text-anchor="end">0</text><line x1="30" x2="262" y1="134.9" y2="134.9" class="crg"/><text x="24" y="138.4" class="crt" text-anchor="end">4</text><line x1="30" x2="262" y1="85.7" y2="85.7" class="crg"/><text x="24" y="89.2" class="crt" text-anchor="end">8</text><line x1="30" x2="262" y1="36.6" y2="36.6" class="crg"/><text x="24" y="40.1" class="crt" text-anchor="end">12</text><text x="30.0" y="202" class="crt" text-anchor="middle">2019</text><text x="68.7" y="202" class="crt" text-anchor="middle">20</text><text x="107.3" y="202" class="crt" text-anchor="middle">21</text><text x="146.0" y="202" class="crt" text-anchor="middle">22</text><text x="184.7" y="202" class="crt" text-anchor="middle">23</text><text x="223.3" y="202" class="crt" text-anchor="middle">24</text><text x="262.0" y="202" class="crt" text-anchor="middle">2025</text><path d="M30.0 155.2 L68.7 152.1 L107.3 139.6 L146.0 132.5 L184.7 125.3 L223.3 104.2 L262.0 29.7" class="crl1"/><path d="M30.0 165.3 L68.7 157.6 L107.3 151.2" class="crl2"/><path d="M184.7 164.3 L223.3 163.9 L262.0 163.7" class="crl2"/><g class="crp"><circle cx="30.0" cy="155.2" r="12" class="crh"/><circle cx="30.0" cy="155.2" r="4" class="crm1"/><title>CT1 2019: 1,333 applications for 568 posts = 2.35:1</title></g><g class="crp"><circle cx="68.7" cy="152.1" r="12" class="crh"/><circle cx="68.7" cy="152.1" r="4" class="crm1"/><title>CT1 2020: 1,479 applications for 569 posts = 2.60:1</title></g><g class="crp"><circle cx="107.3" cy="139.6" r="12" class="crh"/><circle cx="107.3" cy="139.6" r="4" class="crm1"/><title>CT1 2021: 2,046 applications for 566 posts = 3.61:1</title></g><g class="crp"><circle cx="146.0" cy="132.5" r="12" class="crh"/><circle cx="146.0" cy="132.5" r="4" class="crm1"/><title>CT1 2022: 2,337 applications for 558 posts = 4.19:1</title></g><g class="crp"><circle cx="184.7" cy="125.3" r="12" class="crh"/><circle cx="184.7" cy="125.3" r="4" class="crm1"/><title>CT1 2023: 2,604 applications for 545 posts = 4.78:1</title></g><g class="crp"><circle cx="223.3" cy="104.2" r="12" class="crh"/><circle cx="223.3" cy="104.2" r="4" class="crm1"/><title>CT1 2024: 3,522 applications for 542 posts = 6.50:1</title></g><g class="crp"><circle cx="262.0" cy="29.7" r="12" class="crh"/><circle cx="262.0" cy="29.7" r="4" class="crm1"/><title>CT1 2025: 6,770 applications for 539 posts = 12.56:1</title></g><g class="crp"><circle cx="30.0" cy="165.3" r="12" class="crh"/><circle cx="30.0" cy="165.3" r="4" class="crm2o"/><title>ST3 2019: 575 applications for 377 posts = 1.53:1</title></g><g class="crp"><circle cx="68.7" cy="157.6" r="12" class="crh"/><circle cx="68.7" cy="157.6" r="4" class="crm2o"/><title>ST3 2020: 758 applications for 353 posts = 2.15:1</title></g><g class="crp"><circle cx="107.3" cy="151.2" r="12" class="crh"/><circle cx="107.3" cy="151.2" r="4" class="crm2o"/><title>ST3 2021: 1,056 applications for 396 posts = 2.67:1</title></g><g class="crp"><circle cx="184.7" cy="164.3" r="12" class="crh"/><circle cx="184.7" cy="164.3" r="4" class="crm2"/><title>ST4 2023: 640 applications for 399 posts = 1.60:1</title></g><g class="crp"><circle cx="223.3" cy="163.9" r="12" class="crh"/><circle cx="223.3" cy="163.9" r="4" class="crm2"/><title>ST4 2024: 640 applications for 391 posts = 1.64:1</title></g><g class="crp"><circle cx="262.0" cy="163.7" r="12" class="crh"/><circle cx="262.0" cy="163.7" r="4" class="crm2"/><title>ST4 2025: 699 applications for 423 posts = 1.65:1</title></g><text x="270" y="33.7" class="crd">CT1 12.6:1</text><text x="270" y="167.7" class="crd">ST4 1.65:1</text></svg><div class="crstats"><div><b>12.6:1</b><span>CT1 2025<br>6,770 for 539 posts</span></div><div><b>1.65:1</b><span>ST4 2025<br>699 for 423 posts</span></div><div><b>52%</b><span>of departments advertising a consultant post could not appoint (2020)</span></div></div><p><b>Consultant posts:</b> no national competition ratio is published. In the RCoA 2020 census, 103 of 198 departments that advertised could not appoint, and 278 consultant jobs went unfilled, mostly for lack of (suitable) applicants. The bottleneck is getting into training, not the consultant job at the end.</p><details class="crtab"><summary>Show the numbers as a table</summary><table class="rtab"><tr><th>Year</th><th>CT1</th><th>ST3/ST4</th></tr><tr><td>2019</td><td>1,333 / 568 = <b>2.35</b></td><td>ST3: 575 / 377 = <b>1.53</b></td></tr><tr><td>2020</td><td>1,479 / 569 = <b>2.60</b></td><td>ST3: 758 / 353 = <b>2.15</b></td></tr><tr><td>2021</td><td>2,046 / 566 = <b>3.61</b></td><td>ST3: 1,056 / 396 = <b>2.67</b></td></tr><tr><td>2022</td><td>2,337 / 558 = <b>4.19</b></td><td>Not published (ST3 to ST4 change)</td></tr><tr><td>2023</td><td>2,604 / 545 = <b>4.78</b></td><td>ST4: 640 / 399 = <b>1.60</b></td></tr><tr><td>2024</td><td>3,522 / 542 = <b>6.50</b></td><td>ST4: 640 / 391 = <b>1.64</b></td></tr><tr><td>2025</td><td>6,770 / 539 = <b>12.56</b></td><td>ST4: 699 / 423 = <b>1.65</b></td></tr></table></details><p class="muted">Ratios count applications, not unique applicants, and are for England. Sources: <a href="https://medical.hee.nhs.uk/medical-training-recruitment/medical-specialty-training/competition-ratios" target="_blank" rel="noopener">NHS England competition ratios ↗</a>; <a href="https://www.rcoa.ac.uk/sites/default/files/documents/2020-11/Medical-Workforce-Census-Report-2020.pdf" target="_blank" rel="noopener">RCoA Medical Workforce Census 2020 ↗</a>.</p>`};
const EXP_CARD_B=`<p>You can claim tax relief from HMRC on professional fees and subscriptions on its approved list, such as the GMC, BMA and Royal College. Tick the ones you pay and Anaesthetic Ally works out the total and the relief, and keeps it up to date as your grade changes.</p><div class="expmount"></div><h4>What you can and can't claim</h4><ul><li>You can claim for the current year and backdate claims for the previous 4 tax years.</li><li>Claim through your HMRC personal tax account; your tax code then goes up so you pay less tax each month.</li><li>Royal College exam fees, including resits, are allowable if you're on a training programme leading to a CCT in that specialty (BMA guidance). Travel and overnight costs for the exam may be too. Revision courses that aren't a contractual requirement are not.</li><li>You can't claim for anything your employer reimburses. In England, resident doctors' Royal College exam fees (first 2 attempts) are reimbursed from April 2026, and College subscriptions are expected to be from April 2027.</li></ul><p class="note">HMRC decides each claim; check the BMA guidance on <a href="https://www.bma.org.uk/pay-and-contracts/tax/tax-claim/claiming-for-professional-expenses" target="_blank" rel="noopener">claiming for professional expenses</a>.</p><p>Sources: <a href="https://www.gov.uk/tax-relief-for-employees/professional-fees-and-subscriptions" target="_blank" rel="noopener">GOV.UK: professional fees and subscriptions</a> · <a href="https://www.gmc-uk.org/registration-and-licensing/managing-your-registration/fees-and-funding/fees-for-doctors" target="_blank" rel="noopener">GMC fees</a> · <a href="https://www.bma.org.uk/join-us/subscription-costs" target="_blank" rel="noopener">BMA subscription costs</a> · <a href="https://rcoa.ac.uk/examinations/reviews-reports/cost-training" target="_blank" rel="noopener">RCoA cost of training</a></p>`;

const LOCUM_CARD={h:"Locum shifts",b:`<ul><li><b>Ask for no NHS pension to be taken from your locums.</b> When you register with a bank or locum office, ask them not to deduct NHS pension contributions from locum shifts. Pension deductions on extra shifts can push you into a higher contribution tier and add to your pension growth for annual allowance purposes.</li><li>Check with the trust's pensions or payroll team how they handle it, and weigh up the pension benefit you give up.</li><li>Check whether the shift is paid through the same payroll as your main job or a separate one, and add it to the 60% tax check.</li></ul>`};

const FELLOW_CARD={h:"Clinical fellow jobs",b:`<p>Clinical fellow posts in anaesthesia (junior, senior, trust, teaching, research, simulation, QI and perioperative fellowships) from <a href="https://www.healthjobsuk.com/job_list/Medical_and_dental/s2/Medical_Anaesthesia/d535" target="_blank" rel="noopener">Health Jobs UK ↗</a> and <a href="https://www.bmj.com/careers/jobs/anaesthesia/united-kingdom/" target="_blank" rel="noopener">BMJ Careers ↗</a>, refreshed every morning. Filter by region, then tap a post to open it.</p><p>A fellow year can build your portfolio for ST4: teaching, QI, research or simulation time all count. Check the job plan for protected non-clinical time and the on-call commitment.</p><p>Many fellow posts are only on NHS Jobs, which can't be pulled into this feed: <a href="https://www.jobs.nhs.uk/candidate/search/results?keyword=clinical%20fellow%20anaesthetics" target="_blank" rel="noopener">search NHS Jobs for clinical fellow anaesthetics posts ↗</a>. For Scotland, check <a href="https://apply.jobs.scot.nhs.uk/" target="_blank" rel="noopener">NHS Scotland Jobs ↗</a>.</p><div class="jobsfeed" data-feed="fellows"></div>`};

const CUP='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z" fill="var(--coffee)"/><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16" fill="none" stroke="var(--coffee)" stroke-width="2"/></svg>';
async function runBrew(n){
  const svg=document.getElementById("brew");if(!svg)return;
  const liq=svg.querySelector(".liq"),str=svg.querySelector(".stream"),steam=svg.querySelector(".steam"),row=document.getElementById("cups"),num=document.getElementById("gotNum");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||!liq.animate){liq.style.transform="none";steam.style.opacity=.7;row.innerHTML=CUP.repeat(n);num.textContent=n;return}
  const go=(el,k,o)=>el.animate(k,{fill:"forwards",...o}).finished;
  try{
  for(let i=1;i<=n;i++){
    if(!svg.isConnected)return;
    const sp=i===1?1:.55;
    [liq,str,steam].forEach(e=>e.getAnimations().forEach(a=>a.cancel()));
    await go(str,[{transform:"scaleY(0)",opacity:1},{transform:"scaleY(1)",opacity:1}],{duration:260*sp,easing:"ease-in"});
    await go(liq,[{transform:"scaleY(0)"},{transform:"scaleY(1)"}],{duration:1000*sp,easing:"cubic-bezier(.3,.1,.4,1)"});
    await go(str,[{transform:"scaleY(1)",opacity:1},{transform:"scaleY(1)",opacity:0}],{duration:160*sp});
    go(steam,[{opacity:0,transform:"translateY(4px)"},{opacity:.75,transform:"translateY(0)"}],{duration:450});
    row.insertAdjacentHTML("beforeend",CUP);num.textContent=i;
    if(i<n)await new Promise(r=>setTimeout(r,420*sp));
  }}catch(e){}
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sbaMixed(st){const s=sbaSet(st);return s.some(q=>q.g==="p")&&s.some(q=>q.g==="f")}
function sbaFilter(st){if(!sbaMixed(st))return "";const s=sbaSet(st),n=g=>s.filter(q=>q.g===g).length;
  return `<div class="sbaflt" role="group" aria-label="Filter SBAs">${[["all","All",s.length],["p","Primary",n("p")],["f","Final",n("f")]].map(([v,l,c])=>`<button class="fchip ${L.sbf===v?"on":""}" data-sbf="${v}" aria-pressed="${L.sbf===v}">${l} <em>${c}</em></button>`).join("")}</div>`}

  <div class="sbastats"><div><b>${seen}</b><span>answered</span></div><div><b>${seen?Math.round(right/seen*100):0}%</b><span>correct last time</span></div><div><b>${SB.length-seen}</b><span>not seen yet</span></div></div>
  <label class="sbaf">${B.chap}<select id="sbaar">${opt("","All ("+SB.length+")",pr.ar)}${AR.map(a=>opt(a,a+" ("+cnt(a)+")",pr.ar)).join("")}</select></label>

  <p class="note" id="sbamsg">Written for Anaesthetic Ally. Explanations reflect UK guidance up to mid-2026; check specific numbers against the current guideline.</p>`;

function startBank(){

  if(t.dataset.sbf){L.sbf=t.dataset.sbf;L.steps=sbaSteps(L.st,L.sbf);L.step=0;L.correct=0;L.missed=[];draw();sheet.querySelector(".sh-body").scrollTop=0;return}

function filterContents(raw){
  try{sessionStorage.setItem("cq",raw)}catch(e){}
  const q=raw.trim().toLowerCase();let shown=0;
  const re=q?new RegExp("(^|[^a-z0-9])"+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")):null,m=t=>re.test(t);
  sheet.querySelectorAll(".crow:not(.rv)").forEach(r=>{
    let hit=!q,tab=null;
    if(q){
      if(r.dataset.gostop){const st=ALL.find(x=>x.id===r.dataset.gostop);
        if(m(st._key))hit=true;else{tab=st._tabs.find(t=>m(t.text));hit=!!tab}}
      else if(r.dataset.gonote!=null){const st=NOTES[+r.dataset.gonote];
        if(m(st._key))hit=true;else{tab=st._tabs.find(t=>m(t.text));hit=!!tab}}
      else{const t=PRIMARY.topics[r.dataset.gotopic];hit=m((t.n+" "+t.c).toLowerCase())||m(t._t||(t._t=strip(t.h).toLowerCase()))}
    }
    r.hidden=!hit;r.dataset.tab=tab?tab.id:"";
    r.querySelector(".chit").textContent=tab?`in “${tab.name}”`:"";
    if(hit)shown++;
  });
  sheet.querySelectorAll(".cgrp").forEach(g=>g.hidden=![...g.querySelectorAll(".crow")].some(r=>!r.hidden));
  sheet.querySelectorAll(".cstage").forEach(g=>g.hidden=![...g.querySelectorAll(".crow")].some(r=>!r.hidden));
  sheet.querySelector("#cnone").hidden=shown>0;
  sheet.querySelector("#cinfo").textContent=q?`${shown} match${shown===1?"":"es"}`:`${ALL.length} stops, ${NOTES.length} Final FRCA notes and ${Object.keys(PRIMARY.topics).length} Primary FRCA topics. Tap one to go straight to it.`;
}

function arcpItems(Y){const out=ARCP_EVERY.map(i=>Y.y+":"+i[0]);Y.groups.forEach(g=>{(g.items||[]).forEach(i=>out.push(Y.y+":"+i[0]));(g.subs||[]).forEach(s=>s.items.forEach(i=>out.push(Y.y+":"+i[0])))});return out}

const PQ={
 role:{q:"What best describes you?",o:["Medical student","Foundation doctor (FY1 or FY2)","Anaesthetist in training or clinical fellow","Consultant or SAS anaesthetist"]},
 exam:{q:"Where are you with the Primary FRCA?",o:["No FRCA exams yet","Primary FRCA written (MCQ) passed","Primary FRCA complete"]},
 st4:{q:"Have you got an ST4 post?",o:["Yes","Not yet"]},
 final:{q:"Have you completed the Final FRCA?",o:["Yes","Not yet"]},
 st2done:{q:"Have you completed Stage 2 (ST4 and ST5)?",o:["Yes","Not yet"]},
 cons:{q:"Have you got a consultant job?",o:["Yes","Not yet"]}
};
const PQ_ORDER=["role","exam","st4","final","st2done","cons"];
const PQ_SUM={st4:["Got an ST4 post","No ST4 post yet"],final:["Final FRCA complete","Final FRCA to go"],st2done:["Stage 2 completed","In Stage 2"],cons:["Consultant job secured","No consultant job yet"]};
const NHS_RE=/^[^\s@]+@([a-z0-9-]+\.)*(nhs\.net|nhs\.uk|nhs\.scot|hscni\.net)$/i;
const UNI_RE=/^[^\s@]+@([a-z0-9-]+\.)*ac\.uk$/i;
const firstOf=id=>ALL.findIndex(s=>s.stage.id===id);
const stopByTitle=(stage,t)=>ALL.find(s=>s.stage.id===stage&&s.title===t);
// which question comes next, given the answers so far (null = finished)
function nextQ(a){
  if(!a.role)return "role";
  if(a.role!==PQ.role.o[2])return null;
  if(!a.exam)return "exam";
  if(a.exam!==PQ.exam.o[2])return null;
  for(const k of ["st4","final","st2done","cons"]){if(!a[k])return k;if(a[k]!=="Yes")return null}
  return null;
}
function placement(a){
  const r=PQ.role.o.indexOf(a.role),e=PQ.exam.o.indexOf(a.exam),Y=k=>a[k]==="Yes";
  let startStop=ALL[0];const extra=[];
  if(r===3)startStop=ALL[firstOf("cons")];
  else if(r===2){
    startStop=ALL[firstOf("core")];
    if(e>=1)extra.push(stopByTitle("core","Primary FRCA: written"));
    if(e>=2){
      extra.push(stopByTitle("core","Primary FRCA: OSCE & SOE"));
      if(!Y("st4"))startStop=stopByTitle("core","ST4 interview");
      else{
        startStop=ALL[firstOf("st2")];
        if(Y("final")){
          extra.push(stopByTitle("st2","Final FRCA: written"),stopByTitle("st2","Final FRCA: SOE"));
          if(Y("st2done"))startStop=Y("cons")?ALL[firstOf("cons")]:ALL[firstOf("st3")];
        }
      }
    }
  }
  const done=new Set(ALL.slice(0,ALL.indexOf(startStop)).map(s=>s.id));
  extra.filter(Boolean).forEach(s=>done.add(s.id));
  return {stage:startStop.stage.id,start:startStop,done:[...done]};
}

  }else{

    body=`<p class="qcount">Question ${hist.indexOf(PSTEP)} </p><h3>${Q.q}</h3><div class="ochips col" role="group">${Q.o.map(o=>`<button class="ochip" data-v="${o}" aria-pressed="${PA[PSTEP]===o}">${o}</button>`).join("")}</div>`;

const TAX_HTML="<div class=\"wrap\">\n  <header>\n    <div>\n      <h1>60% Tax Check<\/h1>\n      <p class=\"sub\">Adjusted net income against the \u00a3100,000 personal allowance taper<\/p>\n    <\/div>\n    <div class=\"tabs\" role=\"group\" aria-label=\"Tax year\">\n      <button type=\"button\" data-year=\"2026-27\" aria-pressed=\"true\">2026/27<\/button>\n      <button type=\"button\" data-year=\"2027-28\" aria-pressed=\"false\">2027/28<\/button>\n    <\/div>\n  <\/header>\n\n  <section class=\"panel\" aria-live=\"polite\">\n    <div class=\"verdict\">\n      <div>\n        <div class=\"label\">Projected adjusted net income<\/div>\n        <div class=\"big\" id=\"ani\">\u2014<\/div>\n      <\/div>\n      <span class=\"chip safe\" id=\"chip\">\u2014<\/span>\n      <p id=\"verdictText\"><\/p>\n    <\/div>\n    <div class=\"gauge\" id=\"gauge\">\n      <div class=\"marker\" id=\"marker\"><b id=\"markerLabel\">\u2014<\/b><i><\/i><\/div>\n      <div class=\"track\"><span class=\"z1\" id=\"z1\"><\/span><span class=\"z2\" id=\"z2\"><\/span><span class=\"z3\" id=\"z3\"><\/span><\/div>\n      <div class=\"ticks\" id=\"ticks\"><\/div>\n    <\/div>\n    <div class=\"legend\">\n      <span style=\"--sw:var(--accent-soft)\">40% band<\/span>\n      <span style=\"--sw:var(--danger)\">60% effective band (\u00a3100,000\u2013\u00a3125,140)<\/span>\n      <span style=\"--sw:var(--line)\">45% band<\/span>\n    <\/div>\n    <div class=\"callout\" id=\"sippBox\" hidden><\/div>\n  <\/section>\n\n  <section class=\"panel\">\n    <h2>How it adds up<\/h2>\n    <div class=\"tablewrap\"><table><tbody id=\"breakdown\"><\/tbody><\/table><\/div>\n  <\/section>\n\n  <section class=\"panel\">\n    <div>\n      <h2>Payslips<\/h2>\n      <p class=\"sub\">Enter the year-to-date figures from each payslip. The latest one drives the projection.<\/p>\n    <\/div>\n    <div class=\"tablewrap\"><table>\n      <thead><tr><th>Month<\/th><th class=\"r\">Taxable pay YTD<\/th><th class=\"r\">Pension YTD<\/th><th><\/th><\/tr><\/thead>\n      <tbody id=\"slips\"><\/tbody>\n    <\/table><\/div>\n    <p class=\"empty\" id=\"slipsEmpty\">No payslips yet. Until you add one, the year is projected from the expected monthly pay below.<\/p>\n    <form class=\"row\" id=\"slipForm\">\n      <div class=\"field\"><label for=\"slipMonth\">Payslip month<\/label><select id=\"slipMonth\"><\/select><\/div>\n      <div class=\"field\"><label for=\"slipTaxable\">Taxable pay YTD (\u00a3)<\/label><input id=\"slipTaxable\" class=\"num\" inputmode=\"decimal\" required><\/div>\n      <div class=\"field\"><label for=\"slipPension\">Pension YTD (\u00a3)<\/label><input id=\"slipPension\" class=\"num\" inputmode=\"decimal\"><\/div>\n      <button class=\"btn\" type=\"submit\">Add payslip<\/button>\n    <\/form>\n    <div class=\"field\">\n      <label for=\"expected\">Expected taxable pay per month for the months left (\u00a3)<\/label>\n      <input id=\"expected\" class=\"num\" inputmode=\"decimal\">\n      <span class=\"hint\">Gross monthly pay minus NHS pension<\/span>\n    <\/div>\n  <\/section>\n\n  <section class=\"panel\">\n    <div>\n      <h2>Other work<\/h2>\n      <p class=\"sub\">Locums, bank shifts, WLIs, teaching and any other earnings.<\/p>\n    <\/div>\n    <div class=\"tablewrap\"><table>\n      <tbody id=\"extras\"><\/tbody>\n    <\/table><\/div>\n    <p class=\"empty\" id=\"extrasEmpty\">Nothing added yet.<\/p>\n    <form class=\"row\" id=\"extraForm\">\n      <div class=\"field\"><label for=\"exLabel\">What<\/label><input id=\"exLabel\" required><\/div>\n      <div class=\"field\"><label for=\"exAmount\">Gross (\u00a3)<\/label><input id=\"exAmount\" class=\"num\" inputmode=\"decimal\" required><\/div>\n      <div class=\"field\"><label for=\"exKind\">Paid how<\/label>\n        <select id=\"exKind\">\n          <option value=\"separate\">Separate payroll (adds on)<\/option>\n          <option value=\"included\">Same payroll (already in payslip YTD)<\/option>\n          <option value=\"self\">Self-employed<\/option>\n        <\/select><\/div>\n      <button class=\"btn\" type=\"submit\">Add<\/button>\n    <\/form>\n  <\/section>\n\n  <section class=\"panel\">\n    <h2>Reliefs and other income<\/h2>\n    <div class=\"grid\">\n      <div class=\"field\"><label for=\"fees\">Professional fees relief (\u00a3)<\/label><input id=\"fees\" class=\"num\" inputmode=\"decimal\"><span class=\"hint\">GMC, RCoA, AAGBI, defence union<\/span><\/div>\n      <div class=\"field\"><label for=\"interest\">Savings interest (\u00a3)<\/label><input id=\"interest\" class=\"num\" inputmode=\"decimal\"><span class=\"hint\">Not ISAs or Premium Bonds<\/span><\/div>\n      <div class=\"field\"><label for=\"sipp\">SIPP paid in, net (\u00a3)<\/label><input id=\"sipp\" class=\"num\" inputmode=\"decimal\"><span class=\"hint\">What you paid; 25% is added on top<\/span><\/div>\n      <div class=\"field\"><label for=\"giftaid\">Gift Aid donations (\u00a3)<\/label><input id=\"giftaid\" class=\"num\" inputmode=\"decimal\"><span class=\"hint\">What you gave; grossed up by 25%<\/span><\/div>\n      <div class=\"field\"><label for=\"seExp\">Self-employed expenses (\u00a3)<\/label><input id=\"seExp\" class=\"num\" inputmode=\"decimal\"><span class=\"hint\">Used instead of the \u00a31,000 allowance if larger<\/span><\/div>\n    <\/div>\n    <h2>Other income<\/h2>\n    <div class=\"grid\">\n      <div class=\"field\"><label for=\"rental\">Rental profit (\u00a3)<\/label><input id=\"rental\" class=\"num\" inputmode=\"decimal\"><span class=\"hint\">After allowable expenses<\/span><\/div>\n      <div class=\"field\"><label for=\"dividends\">Dividends (\u00a3)<\/label><input id=\"dividends\" class=\"num\" inputmode=\"decimal\"><span class=\"hint\">From your own company or shares outside an ISA<\/span><\/div>\n      <div class=\"field\"><label for=\"benefits\">Taxable benefits (\u00a3)<\/label><input id=\"benefits\" class=\"num\" inputmode=\"decimal\"><span class=\"hint\">P11D value, e.g. a company car<\/span><\/div>\n      <div class=\"field\"><label for=\"otherInc\">Anything else taxable (\u00a3)<\/label><input id=\"otherInc\" class=\"num\" inputmode=\"decimal\"><span class=\"hint\">Royalties, app income, other one-offs<\/span><\/div>\n    <\/div>\n    <h2>Student loan<\/h2>\n    <div class=\"grid\">\n      <div class=\"field\"><label for=\"slUG\">Undergraduate loan<\/label>\n        <select id=\"slUG\"><option value=\"\">None<\/option><option value=\"1\">Plan 1<\/option><option value=\"2\">Plan 2<\/option><option value=\"4\">Plan 4 (Scotland)<\/option><option value=\"5\">Plan 5<\/option><\/select>\n        <span class=\"hint\">9% of earnings over the threshold<\/span><\/div>\n      <div class=\"field\"><label for=\"slPG\">Postgraduate loan<\/label>\n        <select id=\"slPG\"><option value=\"\">None<\/option><option value=\"pg\">Postgraduate Loan<\/option><\/select>\n        <span class=\"hint\">6% of earnings over the threshold<\/span><\/div>\n    <\/div>\n    <p class=\"foot\" style=\"margin:0\">Student loan repayments don't change your adjusted net income, but they reduce what you keep from extra work.<\/p>\n  <\/section>\n\n  <section class=\"panel\">\n    <h2>Before you take a shift<\/h2>\n    <div class=\"row\">\n      <div class=\"field\"><label for=\"whatif\">Extra gross pay (\u00a3)<\/label><input id=\"whatif\" class=\"num\" inputmode=\"decimal\" value=\"1000\"><\/div>\n    <\/div>\n    <div class=\"callout\" id=\"whatifOut\"><\/div>\n  <\/section>\n\n  <div class=\"status\" id=\"status\"><\/div>\n\n  <footer class=\"foot\">\n    <p>Projection = latest payslip's taxable pay to date + expected pay \u00d7 months left. Taxable pay on NHS payslips is already after pension contributions.<\/p>\n    <p>Self-employed income up to \u00a31,000 is covered by the trading allowance. Take-home figures assume 40% / 60% / 45% income tax plus 2% NI, and any student loan you select. Thresholds are frozen at \u00a3100,000 and \u00a3125,140. This is an estimate, not tax advice.<\/p>\n  <\/footer>\n<\/div>";
function mountTaxTracker(host){
  if(host.shadowRoot)return;
  const root=host.attachShadow({mode:"open"});
  const dt=document.documentElement.getAttribute("data-theme");if(dt==="dark")host.setAttribute("data-dark","");if(dt==="light")host.setAttribute("data-light","");
  root.innerHTML=`<style>${TAX_CSS}</style>`+TAX_HTML;
  const TA = 1000, LOW = 100000, HIGH = 125140, GMIN = 80000, GMAX = 130000;
  const YEARS = ["2026-27","2027-28"];
  const MONTHS = ["April","May","June","July","August","September","October","November","December","January","February","March"];
  const gbp = new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP",maximumFractionDigits:0});
  const gbp2 = new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP",minimumFractionDigits:2,maximumFractionDigits:2});
  const $ = id => root.getElementById(id);
  const n = v => { const x = parseFloat(String(v ?? "").replace(/[£,\s]/g,"")); return isFinite(x) ? x : 0; };
  const blank = () => ({expectedMonthly:"",payslips:[],extras:[],fees:"",interest:"",sippNet:"",giftAidNet:"",seExpenses:"",rental:"",dividends:"",benefits:"",otherInc:"",slUG:"",slPG:""});

  const state = {}; YEARS.forEach(y => state[y] = blank());
  let year = "2026-27", saveTimers = {};

  // ---------- storage ----------
  function lsGet(y){ try { const s = localStorage.getItem("pathway-band-"+y); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
  function lsSet(y){ try { localStorage.setItem("pathway-band-"+y, JSON.stringify(state[y])); } catch(e){} }
  function scheduleSave(y){
    clearTimeout(saveTimers[y]);
    saveTimers[y] = setTimeout(() => persist(y), 700);
  }
  function persist(y){
    lsSet(y);
    $("status").textContent = "Saved on this device.";
  }

  // ---------- calculation ----------
  function calc(s){
    const slips = [...s.payslips].sort((a,b)=>a.m-b.m);
    const latest = slips[slips.length-1];
    const exp = n(s.expectedMonthly);
    const monthsDone = latest ? latest.m : 0;
    const ytd = latest ? n(latest.taxable) : 0;
    const projectedRest = (12 - monthsDone) * exp;
    const main = ytd + projectedRest;
    const sep = s.extras.filter(e=>e.kind==="separate").reduce((t,e)=>t+n(e.amount),0);
    const inc = s.extras.filter(e=>e.kind==="included").reduce((t,e)=>t+n(e.amount),0);
    const seGross = s.extras.filter(e=>e.kind==="self").reduce((t,e)=>t+n(e.amount),0);
    const seDeduct = seGross <= TA ? seGross : Math.max(TA, n(s.seExpenses));
    const seTaxable = Math.max(0, seGross - seDeduct);
    const interest = n(s.interest), fees = n(s.fees);
    const sippGross = n(s.sippNet) * 1.25, giftGross = n(s.giftAidNet) * 1.25;
    const rental = n(s.rental), dividends = n(s.dividends), benefits = n(s.benefits), otherInc = n(s.otherInc);
    const ani = main + sep + seTaxable + interest + rental + dividends + benefits + otherInc - fees - sippGross - giftGross;
    const slRate = (s.slUG ? 0.09 : 0) + (s.slPG ? 0.06 : 0);
    return {latest, monthsDone, ytd, exp, projectedRest, main, sep, inc, seGross, seTaxable, interest, rental, dividends, benefits, otherInc, fees, sippGross, giftGross, ani, slRate};
  }
  // income tax + 2% NI on extra employment pay, starting at ani
  function costOfExtra(ani, extra, slRate){
    let tax = extra * (slRate||0), a = ani, left = extra;
    const bands = [[LOW,0.42],[HIGH,0.62],[Infinity,0.47]];
    for (const [top,rate] of bands){
      if (left <= 0) break;
      if (a >= top) continue;
      const chunk = Math.min(left, top - a);
      tax += chunk * rate; a += chunk; left -= chunk;
    }
    return tax;
  }

  // ---------- render ----------
  function pct(v){ return Math.max(0, Math.min(100, (v - GMIN) / (GMAX - GMIN) * 100)); }
  function renderGauge(ani){
    $("z1").style.width = pct(LOW)+"%";
    $("z2").style.width = (pct(HIGH)-pct(LOW))+"%";
    $("z3").style.width = (100-pct(HIGH))+"%";
    const p = pct(ani);
    $("marker").style.left = Math.max(6, Math.min(94, p))+"%";
    $("marker").querySelector("i").style.marginLeft = "0";
    $("markerLabel").textContent = gbp.format(ani);
    const ticks = [80000,90000,100000,110000,125140,130000].filter(t=>t!==130000);
    $("ticks").innerHTML = ticks.map(t => `<span style="left:${pct(t)}%">${t===125140?"£125k":"£"+(t/1000)+"k"}</span>`).join("");
  }

  function row(label, value, note, cls){
    return `<tr${cls?` class="${cls}"`:""}><td>${label}${note?`<small>${note}</small>`:""}</td><td class="r">${value}</td></tr>`;
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  const signed = v => (v<0?"− ":"+ ") + gbp.format(Math.abs(v));

  function render(){
    const s = state[year], c = calc(s);
    const headroom = LOW - c.ani;
    $("ani").textContent = gbp.format(c.ani);
    const chip = $("chip");
    if (c.ani > LOW){ chip.className = "chip danger"; chip.textContent = "In the 60% band"; }
    else if (headroom < 2000){ chip.className = "chip warn"; chip.textContent = "Close to £100k"; }
    else { chip.className = "chip safe"; chip.textContent = "Under £100k"; }

    const basis = c.latest ? `${MONTHS[c.latest.m-1]} payslip plus ${12-c.monthsDone} month${12-c.monthsDone===1?"":"s"} projected` : "expected monthly pay for all 12 months";
    $("verdictText").innerHTML = c.ani > LOW
      ? `<strong>${gbp.format(c.ani-LOW)} over</strong> the threshold, based on your ${basis}.`
      : `<strong>${gbp.format(headroom)} of headroom</strong> before the 60% band, based on your ${basis}.`;
    renderGauge(c.ani);

    const box = $("sippBox");
    if (c.ani > LOW){
      const over = Math.min(c.ani, HIGH) - LOW;
      box.hidden = false; box.className = "callout danger";
      box.innerHTML = `To bring this back to £100,000, pay about <strong class="num">${gbp.format(over*0.8)}</strong> into a SIPP before 5 April (${gbp.format(over)} once the 25% top-up is added). After reclaiming higher-rate relief, it costs you roughly ${gbp.format(over*0.4)}.`;
    } else box.hidden = true;

    let b = "";
    b += row("Main job, taxable pay to date", gbp.format(c.ytd), c.latest ? `${MONTHS[c.latest.m-1]} payslip` : "No payslip yet");
    b += row("Rest of year, projected", "+ "+gbp.format(c.projectedRest), `${12-c.monthsDone} × ${gbp.format(c.exp)}`);
    if (c.sep) b += row("Separate-payroll work", "+ "+gbp.format(c.sep));
    if (c.inc) b += row("Same-payroll work", gbp.format(0), `${gbp.format(c.inc)} already counted in your payslip`);
    if (c.seGross) b += row("Self-employed work", "+ "+gbp.format(c.seTaxable), c.seGross <= TA ? `${gbp.format(c.seGross)} covered by the £1,000 trading allowance` : `${gbp.format(c.seGross)} gross, less ${gbp.format(c.seGross-c.seTaxable)}`);
    if (c.interest) b += row("Savings interest", "+ "+gbp.format(c.interest));
    if (c.rental) b += row("Rental profit", "+ "+gbp.format(c.rental));
    if (c.dividends) b += row("Dividends", "+ "+gbp.format(c.dividends));
    if (c.benefits) b += row("Taxable benefits", "+ "+gbp.format(c.benefits));
    if (c.otherInc) b += row("Other taxable income", "+ "+gbp.format(c.otherInc));
    if (c.fees) b += row("Professional fees relief", signed(-c.fees));
    if (c.sippGross) b += row("SIPP contributions (grossed up)", signed(-c.sippGross));
    if (c.giftGross) b += row("Gift Aid (grossed up)", signed(-c.giftGross));
    b += row("Adjusted net income", gbp.format(c.ani), "", "total");
    $("breakdown").innerHTML = b;

    const slips = [...s.payslips].sort((a,b)=>a.m-b.m);
    $("slips").innerHTML = slips.map(p => `<tr><td>${MONTHS[p.m-1]}</td><td class="r">${gbp2.format(n(p.taxable))}</td><td class="r">${p.pension!==""&&p.pension!=null?gbp2.format(n(p.pension)):"—"}</td><td class="r"><button class="x" type="button" data-del-slip="${p.m}" aria-label="Remove ${MONTHS[p.m-1]} payslip">×</button></td></tr>`).join("");
    $("slipsEmpty").hidden = slips.length > 0;

    const kindName = {separate:"Separate payroll", included:"Same payroll", self:"Self-employed"};
    $("extras").innerHTML = s.extras.map(e => `<tr><td>${esc(e.label)}<small>${kindName[e.kind]}</small></td><td class="r">${gbp.format(n(e.amount))}</td><td class="r"><button class="x" type="button" data-del-extra="${esc(e.id)}" aria-label="Remove ${esc(e.label)}">×</button></td></tr>`).join("");
    $("extrasEmpty").hidden = s.extras.length > 0;

    renderWhatIf(c);
  }

  function renderWhatIf(c){
    const x = n($("whatif").value);
    if (!x){ $("whatifOut").innerHTML = "Enter an amount to see where it lands."; return; }
    const cost = costOfExtra(c.ani, x, c.slRate), keep = x - cost, after = c.ani + x;
    const crosses = c.ani <= LOW && after > LOW;
    $("whatifOut").className = "callout" + (after > LOW ? " danger" : "");
    $("whatifOut").innerHTML = `${gbp.format(x)} more takes you to <strong class="num">${gbp.format(after)}</strong>. You'd keep about <strong class="num">${gbp.format(keep)}</strong> after tax, NI${c.slRate?" and student loan":""}${crosses?`, because ${gbp.format(after-LOW)} of it falls in the 60% band`:after>LOW?", with it taxed at an effective 62%":""}.`;
  }

  function fillInputs(){
    const s = state[year];
    $("expected").value = s.expectedMonthly ?? "";
    $("fees").value = s.fees ?? ""; $("interest").value = s.interest ?? "";
    $("sipp").value = s.sippNet ?? ""; $("giftaid").value = s.giftAidNet ?? ""; $("seExp").value = s.seExpenses ?? "";
    ["rental","dividends","benefits","otherInc","slUG","slPG"].forEach(k => $(k).value = s[k] ?? "");
  }

  // ---------- events ----------
  $("slipMonth").innerHTML = MONTHS.map((m,i)=>`<option value="${i+1}">${m}</option>`).join("");
  root.querySelectorAll(".tabs button").forEach(btn => btn.addEventListener("click", () => {
    year = btn.dataset.year;
    root.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", String(b===btn)));
    fillInputs(); render();
  }));
  const bind = (id, key) => $(id).addEventListener("input", e => { state[year][key] = e.target.value; render(); scheduleSave(year); });
  bind("expected","expectedMonthly"); bind("fees","fees"); bind("interest","interest");
  bind("sipp","sippNet"); bind("giftaid","giftAidNet"); bind("seExp","seExpenses");
  ["rental","dividends","benefits","otherInc"].forEach(k => bind(k,k));
  ["slUG","slPG"].forEach(k => $(k).addEventListener("change", e => { state[year][k] = e.target.value; render(); scheduleSave(year); }));
  $("whatif").addEventListener("input", () => renderWhatIf(calc(state[year])));

  $("slipForm").addEventListener("submit", e => {
    e.preventDefault();
    const m = +$("slipMonth").value, taxable = $("slipTaxable").value.trim();
    if (!taxable) return;
    const s = state[year];
    s.payslips = s.payslips.filter(p => p.m !== m).concat({m, taxable: String(n(taxable)), pension: $("slipPension").value.trim() ? String(n($("slipPension").value)) : ""});
    $("slipTaxable").value = ""; $("slipPension").value = "";
    if (m < 12) $("slipMonth").value = String(m+1);
    render(); scheduleSave(year);
  });
  $("extraForm").addEventListener("submit", e => {
    e.preventDefault();
    const label = $("exLabel").value.trim(), amount = $("exAmount").value.trim();
    if (!label || !amount) return;
    state[year].extras.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), label, amount: String(n(amount)), kind: $("exKind").value});
    $("exLabel").value = ""; $("exAmount").value = "";
    render(); scheduleSave(year);
  });
  root.addEventListener("click", e => {
    const ds = e.target.closest("[data-del-slip]"), de = e.target.closest("[data-del-extra]");
    if (ds){ state[year].payslips = state[year].payslips.filter(p => p.m !== +ds.dataset.delSlip); render(); scheduleSave(year); }
    if (de){ state[year].extras = state[year].extras.filter(x => x.id !== de.dataset.delExtra); render(); scheduleSave(year); }
  });

  // ---------- boot ----------
  YEARS.forEach(y => { const l = lsGet(y); if (l) state[y] = Object.assign(blank(), l); });

function paedWeightFromAge(m){const T=PAED_RCUK_WT;if(m<=0)return T[0][1];for(let i=1;i<T.length;i++)if(m<=T[i][0]){const[a,wa]=T[i-1],[b,wb]=T[i];return wa+(wb-wa)*(m-a)/(b-a)}return 70}
function paedFmt(x){if(x>=100)return String(Math.round(x));if(x>=10)return String(Math.round(x*10)/10);if(x>=1)return String(Math.round(x*100)/100);return String(Math.round(x*1000)/1000)}
function paedUnit(v,u){if(u==="µg"&&v>=1000)return[v/1000,"mg"];if(u==="mg"&&v>=1000)return[v/1000,"g"];return[v,u]}
function paedRow(r,w,ageM){
  let per=r.d,label="",fixed=null;
  const mx=r.max?` (max ${paedFmt(paedUnit(r.max,r.u)[0])} ${paedUnit(r.max,r.u)[1]})`:"";
  const unitkg=r.u.replace("/min","")+"/kg"+(r.u.endsWith("/min")?"/min":"");
  if(r.par){per=w<=10?[10]:w<=50?[15]:null;fixed=w>50?1000:null;label=w<=10?"10 mg/kg (max 30 mg/kg/day)":w<=50?"15 mg/kg (max 60 mg/kg/day)":"1 g (max 4 g/day)"}
  else if(r.fn){const o=r.fn(w,ageM);per=o.per||null;fixed=o.fixed??null;label=o.label+(per?mx:"")}
  else{if(r.neo&&ageM!=null&&ageM<1)per=[r.neo];label=per.join("–")+" "+unitkg+mx}
  if(!per&&fixed==null)return `<tr><th scope="row">${r.n}<small>${label}</small></th><td></td><td></td><td>${r.g||""}</td></tr>`;
  const vals=per?per.map(p=>Math.min(p*w,r.max||Infinity)):[fixed];
  const capped=per&&r.max&&per.some(p=>p*w>r.max);
  const dose=vals.map(v=>paedUnit(v,r.u)).map(([v,u])=>paedFmt(v)+" "+u);
  const doseTxt=dose.length>1&&dose[0].split(" ")[1]===dose[1].split(" ")[1]?dose[0].split(" ")[0]+"–"+dose[1]:dose.join("–");
  const vf=x=>x>=10?String(Math.round(x)):x>=1?String(Math.round(x*10)/10):String(Math.round(x*100)/100);
  const vol=r.c?vals.map(v=>vf(v/r.c)).join("–")+" mL":"";
  return `<tr><th scope="row">${r.n}<small>${label}${r.src==="R"?" · RCUK":""}</small></th><td><b>${doseTxt}</b>${capped?' <em class="pcap">max</em>':""}</td><td>${vol?`${vol}<small>of ${r.cl}</small>`:""}</td><td>${r.g||""}</td></tr>`;
}
function paedEquip(w,ageM){
  const y=ageM==null?null:ageM/12,out=[];
  if(y!=null){
    if(y>=1){const cuf=Math.floor((y/4+3.5)*2)/2,unc=Math.floor((y/4+4)*2)/2;out.push(["Tracheal tube (ID)",`Cuffed ${cuf.toFixed(1)} mm · uncuffed ${unc.toFixed(1)} mm`,"Cuffed age/4 + 3.5; uncuffed age/4 + 4. Have half a size either side ready. Cuff pressure under 20 cmH₂O"]);
      out.push(["Tube length",`Oral ${Math.round(y/2+12)} cm · nasal ${Math.round(y/2+15)} cm`,"At the lips or nostril: age/2 + 12 (oral) or + 15 (nasal)"]);}
    else{const unc=w<2?"2.5":w<4?"3.0":ageM<3?"3.5":"4.0";
      out.push(["Tracheal tube (ID)",`Uncuffed ${unc} mm${w>=3?` · cuffed ${ageM<3?"3.0":"3.0–3.5"} mm`:""}`,"Uncuffed: 2.5 under 2 kg, 3.0 for 2–4 kg, 3.5 term neonate, 4.0 from 3 months to 1 year. Aim for a small leak"]);
      out.push(["Tube length",w<=4.5?`Oral about ${Math.round(6+w)} cm at the lips`:"Oral about 11–12 cm at the lips",w<=4.5?"Neonates: 6 + weight (kg)":"Check by auscultation, and a chest X-ray if staying intubated"]);}
    out.push(["Laryngoscope blade",y<1?"Straight":"Curved (Macintosh)","Straight blade under 1 year, curved over 1 year"]);
  }
  const lma=w<5?"1":w<10?"1.5":w<20?"2":w<30?"2.5":w<50?"3":w<=90?"4":"5";
  const ig=w<5?"1":w<12?"1.5":w<25?"2":w<35?"2.5":w<60?"3":"4";
  out.push(["Laryngeal mask",`LMA ${lma} · i-gel ${ig}`,"LMA: 1 under 5 kg, 1.5 5–10, 2 10–20, 2.5 20–30, 3 30 kg to small adult, 4 average adult, 5 over 90 kg. i-gel: 1 2–5 kg, 1.5 5–12, 2 10–25, 2.5 25–35, 3 30–60, 4 50–90"]);
  out.push(["Tidal volume",`${Math.round(7*w)}–${Math.round(8*w)} mL`,"7–8 mL/kg at all ages"]);
  const mt=w<=10?4*w:w<=20?40+2*(w-10):Math.min(60+(w-20),100);
  out.push(["Maintenance fluid",`${Math.round(mt)} mL/h`,"4-2-1 rule: 4 mL/kg/h for the first 10 kg, 2 for the next 10, 1 for each kg above 20. Fasting deficit = hourly rate × hours fasted"]);
  const ebvk=ageM==null?null:ageM<1?90:ageM<36?80:70;
  if(ebvk)out.push(["Circulating blood volume",`About ${Math.round(ebvk*w)} mL`,`${ebvk} mL/kg (premature 100, neonate 90, toddler 80, school age and older 70)`]);
  out.push(["Red cells",`${Math.round(4*w)} mL per 10 g/L rise`,"4 mL/kg raises Hb by about 10 g/L"]);
  out.push(["Fasting","Clear 1 h · breast milk 3 h · formula 4 h · food 6 h","Minimum times; encourage clear fluids up to 1 h before"]);
  return out;
}
function paedAnaph(ageM){
  const rows=[["Under 6 months","100–150 µg (0.1–0.15 mL)","5 µg (0.5 mL)"],["6 months to 6 years","150 µg (0.15 mL)","10 µg (1 mL)"],["6 to 12 years","300 µg (0.3 mL)","25 µg (2.5 mL)"],["Over 12 years","500 µg (0.5 mL)","50 µg (5 mL)"]];
  const k=ageM==null?-1:ageM<6?0:ageM<72?1:ageM<144?2:3;
  return `<table class="ptab"><thead><tr><th>Age</th><th>IM, 1 in 1,000</th><th>IV under anaesthesia, 1 in 100,000 (10 µg/mL)</th></tr></thead><tbody>${rows.map((r,i)=>`<tr${i===k?' class="phit"':""}><th scope="row">${r[0]}</th><td><b>${r[1]}</b></td><td>${r[2]}</td></tr>`).join("")}</tbody></table><p class="note">Repeat IM after 5 min if needed. Give IV boluses by response (about 1 µg/kg); start an infusion after 3 boluses. Fluid bolus 10 mL/kg, repeated as needed.</p>`;
}
function openPaedDrugs(){
  L=null;sheet.className="sheet";sheet.style.cssText=col("c4");showPage();
  let saved={};try{saved=JSON.parse(localStorage.getItem("pw-paedwt")||"{}")}catch(e){}
  sheet.innerHTML=`<div class="sh-head"><button class="close" aria-label="Back to path">← Path</button><div class="sh-title">Drugs</div></div><div class="sh-body"><div class="page drugs paeds">
  <div class="dtabs" role="tablist"><button role="tab" aria-selected="false" data-dtab="adult">Adult drugs</button><button role="tab" aria-selected="true" data-dtab="paeds">Paeds drugs</button></div><h3>Paediatric drug sheet</h3>
  <p class="note dwarn">For education only. Check every dose against the BNFC, your hospital's paediatric drug chart and local protocols before giving it. Never exceed the adult dose. Neonates (up to 44 weeks post-conceptual age) and ex-premature infants often need different doses, so use neonatal guidance for them.</p>
  <div class="pform">
   <label>Age<span><input id="pa" type="number" min="0" max="18" step="any" inputmode="decimal" placeholder="e.g. 4"><select id="pu"><option value="y">years</option><option value="m">months</option></select></span></label>
   <label>Weight (kg)<span><input id="pw" type="number" min="0.5" max="80" step="any" inputmode="decimal" placeholder="kg"></span></label>
  </div>
  <p class="tl-intro" id="pinfo"></p>
  <div id="pout"></div></div></div>`;
  const a=sheet.querySelector("#pa"),u=sheet.querySelector("#pu"),wi=sheet.querySelector("#pw"),out=sheet.querySelector("#pout"),info=sheet.querySelector("#pinfo");
  if(saved.a!=null)a.value=saved.a;if(saved.u)u.value=saved.u;if(saved.w!=null)wi.value=saved.w;
  const render=()=>{
    const av=parseFloat(a.value),wv=parseFloat(wi.value);
    const ageM=isNaN(av)?null:(u.value==="y"?av*12:av);
    let w=wv>0?wv:(ageM!=null?paedWeightFromAge(ageM):null);
    try{localStorage.setItem("pw-paedwt",JSON.stringify({a:isNaN(av)?null:av,u:u.value,w:isNaN(wv)?null:wv}))}catch(e){}
    if(!w){info.textContent="Enter an age, a weight, or both. A measured weight is always better than an estimate.";out.innerHTML="";return}
    w=Math.round(w*10)/10;
    info.innerHTML=wv>0?`Doses for <b>${w} kg</b>.`:`Estimated weight <b>${w} kg</b> from age (RCUK table). Weigh the child if you can.`;
    if(w>50)info.innerHTML+=" Over 50 kg, adult doses usually apply.";
    let h=`<section class="psec"><h4>Equipment, ventilation and fluids</h4><table class="ptab"><tbody>${paedEquip(w,ageM).map(r=>`<tr><th scope="row">${r[0]}</th><td><b>${r[1]}</b></td><td colspan="2">${r[2]}</td></tr>`).join("")}</tbody></table>${ageM==null?'<p class="note">Add an age for tube size and length, laryngoscope blade and blood volume.</p>':""}</section>`;
    PAED_SECS.forEach((S,i)=>{h+=`<section class="psec"><h4>${S.s}</h4><table class="ptab"><thead><tr><th>Drug</th><th>Dose</th><th>Volume</th><th>Notes</th></tr></thead><tbody>${S.rows.map(r=>paedRow(r,w,ageM)).join("")}</tbody></table>${S.note?`<p class="note">${S.note}</p>`:""}`;
      if(i===0)h+=`<p class="subh">Anaphylaxis: adrenaline by age</p>${paedAnaph(ageM)}`;
      h+=`</section>`});
    const ON=new Set(["Adrenaline", "Amiodarone", "Atropine", "Adenosine", "Glucose", "Calcium chloride", "Calcium gluconate", "Magnesium", "Lipid emulsion", "Hydrocortisone", "Propofol", "Ketamine", "Thiopental", "Fentanyl", "Alfentanil", "Suxamethonium", "Rocuronium", "Atracurium", "Glycopyrronium", "Paracetamol", "Ibuprofen", "Diclofenac", "Morphine", "Clonidine", "Ondansetron", "Dexamethasone", "Cyclizine", "Neostigmine", "Sugammadex", "Naloxone", "Flumazenil", "Bupivacaine", "Levobupivacaine", "Lidocaine", "Ropivacaine", "Midazolam", "Lorazepam", "Levetiracetam", "Phenytoin", "Salbutamol", "Aminophylline", "Dexmedetomidine", "Noradrenaline", "Remifentanil", "Tranexamic acid"]);
    const extra=DRUGS.filter(d=>!ON.has(d.n.split(" (")[0].replace(/ \d+(\.\d+)?%$/,"").replace(" sulphate",""))&&d.p&&d.p!=="—");
    h+=`<details class="psec pmore"><summary><h4>More drugs, A to Z</h4><span>${extra.length} drugs not on the sheet above, as per-kg or age-banded doses</span></summary>${extra.map(d=>`<div class="pmrow"><b>${d.n}</b><span>${d.p}</span></div>`).join("")}</details>`;
    h+=`<p class="note">Sources: Association of Paediatric Anaesthetists of Great Britain and Ireland, <i>Anaesthesia for beginners</i> (APA guide, 2023), for most doses, equipment and fluids. Premedication doses are from your own notes. Doses marked RCUK, and the age-based weight estimate, follow Resuscitation Council UK paediatric emergency resources (2026). Lipid emulsion follows the Association of Anaesthetists local anaesthetic toxicity guideline. The A to Z list follows the BNFc. Summarised in our own words.</p>`;
    out.innerHTML=h;
  };
  [a,u,wi].forEach(x=>x.addEventListener("input",render));render();
  sheet.querySelector(".close").addEventListener("click",close);
  sheet.querySelector('[data-dtab="adult"]').addEventListener("click",openDrugs);
}
document.getElementById("drugsBtn").addEventListener("click",openDrugs);
document.getElementById("forumBtn").addEventListener("click",openForum);
/* Follow-ups: cases saved on this device only, with in-app reminders. No patient identifiers. */
const FU_KEY="pathway-followups";
const FU_REPEAT={once:"Once",w1:"Every week",w2:"Every 2 weeks",m1:"Every month"};
const fuToday=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fuAdd=(iso,days)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)};
const fuAddMonth=iso=>{const d=new Date(iso+"T12:00:00");d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,10)};
const fuNice=iso=>{try{return new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}catch(e){return iso}};
const fuLoad=()=>{try{const v=JSON.parse(localStorage.getItem(FU_KEY)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}};
const fuSave=list=>{try{localStorage.setItem(FU_KEY,JSON.stringify(list))}catch(e){}};
const fuDue=list=>list.filter(c=>c.active&&c.next<=fuToday());
/* Block anything that looks like a patient identifier: hospital/NHS numbers or dates of birth. */
function fuLooksIdentifying(t){
  const s=String(t||"");
  if(/\d(?:[\s-]?\d){5,}/.test(s.replace(/\b(19|20)\d\d-\d\d-\d\d\b/g,"")))return "a hospital or NHS number";
  if(/\b[A-Za-z]{1,3}\s?\d{5,}\b/.test(s)||/\b\d{1,2}[\/.]\d{1,2}[\/.](19|20)?\d\d\b/.test(s))return "a hospital number or date of birth";
  if(/\b(dob|d\.o\.b|date of birth|nhs ?no|mrn|hosp(ital)? ?no)\b/i.test(s))return "a patient identifier";
  return "";
}
function fuBadge(){
  const b=document.getElementById("fuBtn");if(!b)return;
  const n=fuDue(fuLoad()).length;let i=b.querySelector(".fubadge");
  if(n){if(!i){i=document.createElement("span");i.className="fubadge";b.appendChild(i)}i.textContent=n;b.setAttribute("aria-label","Follow-ups, "+n+" due")}
  else{if(i)i.remove();b.removeAttribute("aria-label")}
}
function fuNextAfter(c,from){
  if(c.repeat==="w1")return fuAdd(from,7);
  if(c.repeat==="w2")return fuAdd(from,14);
  if(c.repeat==="m1")return fuAddMonth(from);
  return null;
}
function openFollowups(){
  L=null;sheet.className="sheet";sheet.style.cssText=col("c3");showPage();
  sheet.innerHTML=`<div class="sh-head"><button class="close" aria-label="Back to path">← Path</button><div class="sh-title">Follow-ups</div></div><div class="sh-body"><div class="page fu" id="fuPage"></div></div>`;
  sheet.querySelector(".close").onclick=()=>{close();fuBadge()};
  fuRender();
}
function fuRender(msg){
  const el=document.getElementById("fuPage");if(!el)return;
  const list=fuLoad(),today=fuToday();
  const due=list.filter(c=>c.active&&c.next<=today).sort((a,b)=>a.next.localeCompare(b.next));
  const up=list.filter(c=>c.active&&c.next>today).sort((a,b)=>a.next.localeCompare(b.next));
  const done=list.filter(c=>!c.active).sort((a,b)=>(b.stopped||"").localeCompare(a.stopped||""));
  const card=(c,kind)=>`<div class="fucase ${kind}" data-fu="${fesc(c.id)}">
    <div class="fuhead"><b>${fesc(c.label)}</b><span class="fucat">${FU_REPEAT[c.repeat]||"Once"}</span></div>
    <div class="fumeta">Case ${fuNice(c.date)}${c.active?` · ${kind==="due"?(c.next<today?"Overdue since ":"Due ")+fuNice(c.next):"Next "+fuNice(c.next)}`:` · Finished ${fuNice(c.stopped||c.date)}`}</div>
    ${c.notes?`<div class="funotes">${fesc(c.notes)}</div>`:""}
    <div class="fuact">${c.active?`${kind==="due"?`<button class="fbtn" data-fuact="looked">Looked up</button><button class="flink" data-fuact="snooze">Tomorrow</button>`:""}<button class="flink" data-fuact="stop">Stop reminders</button>`:`<button class="flink" data-fuact="restart">Remind me again</button>`}<button class="flink fdel" data-fuact="del">Delete</button></div>
  </div>`;
  el.innerHTML=`<h3>Follow-ups</h3>
  <p class="tl-intro">Save a case you want to find out about later, and choose when to be reminded to look the patient up. Due follow-ups show here and as a number on the Follow-up button whenever you open the app.</p>
  <p class="note fuwarn"><b>No patient identifiers.</b> Don't enter names, hospital or NHS numbers, dates of birth or addresses. Use a description you'll recognise, then look the patient up on your hospital's own system. Cases are kept only on this device and aren't shared or backed up.</p>
  ${msg?`<p class="fumsg">${fesc(msg)}</p>`:""}
  <section class="fusec"><h4>Due now${due.length?` (${due.length})`:""}</h4>${due.length?due.map(c=>card(c,"due")).join(""):`<p class="fnote">Nothing due today.</p>`}</section>
  <form class="fcompose fuform" id="fuForm" autocomplete="off">
    <h4>Add a case</h4>
    <label class="fulbl" for="fuLabel">Description</label>
    <input id="fuLabel" maxlength="80" required placeholder="e.g. Lap chole, Theatre 4, difficult airway">
    <div class="frow">
      <div class="fufield"><label class="fulbl" for="fuDate">Date of case</label><input id="fuDate" type="date" value="${today}" max="${today}"></div>
      <div class="fufield"><label class="fulbl" for="fuFirst">First reminder</label><select id="fuFirst"><option value="1">Tomorrow</option><option value="3">In 3 days</option><option value="7" selected>In 1 week</option><option value="14">In 2 weeks</option><option value="28">In 4 weeks</option></select></div>
      <div class="fufield"><label class="fulbl" for="fuRepeat">Then</label><select id="fuRepeat"><option value="once">Just once</option><option value="w1">Every week until stopped</option><option value="w2">Every 2 weeks until stopped</option><option value="m1">Every month until stopped</option></select></div>
    </div>
    <label class="fulbl" for="fuNotes">What to check (optional)</label>
    <textarea id="fuNotes" rows="2" maxlength="400" placeholder="e.g. Did they need ICU? Any awareness? Histology?"></textarea>
    <p class="ferr" id="fuErr" hidden></p>
    <button class="fbtn" type="submit">Save follow-up</button>
  </form>
  <section class="fusec"><h4>Coming up${up.length?` (${up.length})`:""}</h4>${up.length?up.map(c=>card(c,"up")).join(""):`<p class="fnote">No reminders set.</p>`}</section>
  ${done.length?`<details class="fusec fudone"><summary>Finished (${done.length})</summary>${done.map(c=>card(c,"done")).join("")}</details>`:""}`;
  el.querySelector("#fuForm").onsubmit=e=>{
    e.preventDefault();
    const label=el.querySelector("#fuLabel").value.trim(),notes=el.querySelector("#fuNotes").value.trim();
    const date=el.querySelector("#fuDate").value||today,first=+el.querySelector("#fuFirst").value,repeat=el.querySelector("#fuRepeat").value;
    const err=el.querySelector("#fuErr");
    const bad=fuLooksIdentifying(label)||fuLooksIdentifying(notes);
    if(!label){err.textContent="Add a short description so you'll recognise the case.";err.hidden=false;return}
    if(bad){err.textContent="This looks like it contains "+bad+". Please remove it: follow-ups must not hold patient identifiers.";err.hidden=false;return}
    const l=fuLoad();
    l.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),label,notes,date,repeat,next:fuAdd(today,first),active:true,created:today});
    fuSave(l);fuBadge();fuRender("Saved. You'll be reminded "+fuNice(fuAdd(today,first))+".");
  };
  el.querySelectorAll("[data-fuact]").forEach(b=>b.onclick=()=>{
    const id=b.closest("[data-fu]").dataset.fu,act=b.dataset.fuact;
    let l=fuLoad();const c=l.find(x=>x.id===id);if(!c)return;let m="";
    if(act==="looked"){const n=fuNextAfter(c,today);if(n){c.next=n;m="Next reminder "+fuNice(n)+"."}else{c.active=false;c.stopped=today;m="Done. Moved to Finished."}}
    else if(act==="snooze"){c.next=fuAdd(today,1);m="Snoozed until tomorrow."}
    else if(act==="stop"){c.active=false;c.stopped=today;m="Reminders stopped."}
    else if(act==="restart"){c.active=true;delete c.stopped;c.next=fuAdd(today,7);m="You'll be reminded "+fuNice(c.next)+"."}
    else if(act==="del"){if(!confirm("Delete this follow-up?"))return;l=l.filter(x=>x.id!==id);m="Deleted."}
    fuSave(l);fuBadge();fuRender(m);
  });
}
document.getElementById("fuBtn").addEventListener("click",openFollowups);
fuBadge();document.addEventListener("visibilitychange",()=>{if(!document.hidden)fuBadge()});
(async()=>{try{
  if(!(window.claude&&window.claude.use)){F.state="none";F.v++;fillForum();return}
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  F.db=db;F.user=user;
  if(!db){F.state="none";F.v++;fillForum();return}
  if(user){try{F.me=await user.id();F.owner=!!(await user.isOwner())}catch(e){}}
  db.collection("forum").onSnapshot(snap=>{const all=[];snap.docs.forEach(d=>{const b=d.data()||{};(Array.isArray(b.posts)?b.posts:[]).forEach(p=>{if(p&&p.id&&typeof p.text==="string")all.push({...p,author:d.id,key:d.id+":"+p.id})})});
    F.posts=all;F.state="ok";F.v++;fillForum();fNames()},()=>{F.state="none";F.v++;fillForum()});
}catch(e){F.state="none";F.v++;fillForum()}})();
