<p><b>Severe:</b> HR&gt;110, RR&gt;25, unable to complete sentences, PEFR 33-50%</p>
<p><b>Life-threatening:</b> cyanosis, hypotension, exhaustion, silent chest, tachycardia or bradycardia, PEFR &lt;33%, SpO2 &lt;92%, normal CO2</p>
<p><b>Near fatal:</b> raised PaCO2, requiring ventilation with raised peak pressures</p>
