<p>Glasgow score (&gt;=3 = severe) uses PaO2 &lt;8, age &gt;55, neutrophils &gt;15, calcium &lt;2, urea &gt;16, AST &gt;200/LDH &gt;600, albumin &lt;32, and glucose &gt;10</p>
<p>CT severity index uses the Balthazar grade plus a necrosis score</p>
<p><b>Subtypes:</b> interstitial oedematous vs necrotising</p>
