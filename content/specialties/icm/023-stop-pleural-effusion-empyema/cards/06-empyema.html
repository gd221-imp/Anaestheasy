<p>A collection of pus in the pleural space, from a parapneumonic source, penetrating chest trauma, or Boerhaave's syndrome</p>
<p><b>Findings:</b> frank pus, organisms on gram stain, pH &lt;7.2</p>
<p><b>Treatment:</b> a wide-bore surgical drain with regular flushing using saline or fibrinolytics (e.g. urokinase)</p>
