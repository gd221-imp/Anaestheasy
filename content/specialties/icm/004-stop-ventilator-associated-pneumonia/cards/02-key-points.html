<p>Diagnosis (VAP, &gt;48hrs after starting ventilation): a new or progressive infiltrate on CXR plus 2 or more of purulent secretions, raised oxygen requirement, temperature &gt;38 or &lt;36C, or a white cell count &gt;12 or &lt;4x10^9/L. The CPIS score (&gt;6 suggests VAP is likely) can support diagnosis.</p>
