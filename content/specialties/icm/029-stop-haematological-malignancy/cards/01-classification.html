<p>Leukaemia = 'cancer of white blood cells' (ALL/AML/CLL/CML); lymphoma = cancer of lymph tissue (Hodgkin's/non-Hodgkin's); multiple myeloma = cancer of plasma cells; myeloproliferative disorders = conditions with excess blood cell production (e.g. polycythaemia vera, essential thrombocythaemia)</p>
