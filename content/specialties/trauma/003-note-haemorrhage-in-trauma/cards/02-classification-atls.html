<p>Class 1: ~750mL blood loss, HR &lt;100, normal obs.</p>
<p>Class 2: 750-1500mL, HR &gt;100, ↓pulse pressure.</p>
<p>Class 3: 1500-2000mL, HR &gt;120, ↓BP, RR &gt;30.</p>
<p>Class 4: &gt;2000mL, HR &gt;140, RR &gt;35, anuric, obtunded.</p>
<p>Coagulopathy → acidosis + hypothermia → "lethal triad".</p>
