<p><b>Immune:</b> ABO incompatible, febrile non-haemolytic reaction, TRALI, delayed haemolytic reaction, graft vs host.</p>
<p><b>Non-immune:</b> TACO, hypothermia, dilutional acid-base disorder, VTE, bacterial contamination, VAE (air embolism), hyperkalaemia, citrate toxicity/hypocalcaemia, coagulopathy.</p>
