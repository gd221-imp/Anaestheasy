<p>Hb &lt;80, Na+ &lt;120 or &gt;150, K+ &lt;2.8 or &gt;6, uncontrolled DM, acute heart failure, HR &gt;120, reversible coagulopathy, hypovolaemia, chest infection with sepsis.</p>
<p><b>POST-OP:</b> MDT care (orthogeriatrics, OT, PT) on an appropriate ward with awareness of comorbidities &amp; pathways. Post-op delirium assessment.</p>
