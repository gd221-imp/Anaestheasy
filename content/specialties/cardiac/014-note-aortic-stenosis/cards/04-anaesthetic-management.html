<p>'slow and tight'</p>
<ul>
<li>Maintain sinus rhythm, preload, contractility, and afterload; avoid tachycardia</li>
<li>Atrial contraction ('atrial kick') can contribute up to 40% of preload</li>
<li>Caution with neuraxial/regional techniques</li>
<li>Reduced diastolic time reduces myocardial perfusion</li>
</ul>
