<ul>
<li>MAP &gt; 70mmHg</li>
<li>Pacing wires available to minimise bradycardia</li>
<li>Maintain close communication with surgeon</li>
<li>Maintain temperature (fluid warmer / low theatre trigger / forced air warmer / ambient room temp)</li>
</ul>
<p><b>Post-op:</b> as for any CABG - ITU and wake-up (warm, pain-free, wake)</p>
