<p>Lymphadenopathy plus B symptoms (night sweats, unintentional weight loss, low-grade fever, hepatosplenomegaly, lymphoedema).</p>
<p><b>Red flags:</b> orthopnoea, coughing when supine, stridor, wheeze, syncope, upper body oedema/distended neck veins/plethoric appearance, recurrent pneumonia, dysphagia.</p>
