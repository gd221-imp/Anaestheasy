<ul>
<li>Weight (and height for BMI); use it to calculate drugs and equipment.</li>
<li>Airway: mouth opening, teeth (loose teeth), tonsil size, dysmorphic features.</li>
<li>Chest: signs of URTI or lower respiratory tract infection.</li>
<li>Heart: murmurs (innocent vs pathological).</li>
<li>Veins for cannulation.</li>
</ul>
