<h4>Surgical</h4>
<p class="subh">Immediate</p>
<ul>
<li>Bleeding</li>
<li>Globe perforation (rare)</li>
</ul>
<p class="subh">Delayed</p>
<ul>
<li>Diplopia</li>
<li>Residual or recurrent squint</li>
<li>Infection</li>
</ul>
<h4>Anaesthetic</h4>
<p class="subh">Immediate</p>
<ul>
<li>Oculocardiac reflex: bradycardia, occasionally asystole</li>
</ul>
<p class="subh">Delayed</p>
<ul>
<li>PONV (high risk)</li>
<li>Emergence agitation</li>
</ul>
