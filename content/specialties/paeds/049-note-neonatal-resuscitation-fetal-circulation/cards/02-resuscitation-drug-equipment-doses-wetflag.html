<ul>
<li><b>Weight:</b> (age+4) x 2</li>
<li><b>Energy (defib):</b> 4J x weight</li>
<li><b>Tube (ETT size):</b> age/4 + 4</li>
<li><b>Fluid bolus:</b> 10ml/kg</li>
<li><b>Lorazepam (or other anticonvulsant):</b> 0.1mg x weight</li>
<li><b>Adrenaline:</b> 0.1ml/kg of 1:10,000</li>
<li><b>Glucose:</b> 2ml/kg of 10%</li>
</ul>
