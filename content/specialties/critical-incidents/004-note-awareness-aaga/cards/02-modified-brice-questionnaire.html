<p>6 questions, asked 3 times (before discharge, at follow-up, and later):</p>
<ol>
<li>Last thing you remember before going to sleep?</li>
<li>First thing you remember afterwards?</li>
<li>Anything in between?</li>
<li>Did you dream?</li>
<li>What was the worst thing about your operation?</li>
<li>Any other comments?</li>
</ol>
