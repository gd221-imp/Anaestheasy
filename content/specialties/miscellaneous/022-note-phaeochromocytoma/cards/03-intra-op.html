<p>Arterial line, IABP, CVC, CO monitoring, avoid ketamine/desflurane/depletion of catecholamine stores.</p>
<p>Mg2+/remifentanil + phentolamine for emergency hypertension, esmolol/labetalol for tachyarrhythmia.</p>
<p><b>POST-OP:</b> BM control, steroid support (e.g. if bilateral adrenalectomy).</p>
