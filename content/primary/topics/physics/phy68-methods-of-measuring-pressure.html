<p>P = F/A     F = mass x g     (mass = density x volume)</p>
<ol>
<li>Manometer → open to atm ∴ the gauge pressure relative to Patm is measured. P = ρgh</li>
<li>Bourdon tube gauge → tube expands w/ ↑pressure &amp; moves a dial</li>
<li>Barometer → measures absolute pressure (closed tube)</li>
</ol>
<h4>Absolute P</h4>
<p>Gauge P + atmospheric P</p>
