<h4>Resistance vs DC // Reactance vs AC</h4>
<p>Impedance (Z) = the total of the resistive &amp; reactive components of opposition to electrical flow</p>
<h4>Inductor</h4>
<p>Reactance is high from back EMF in the coil ∴ difficult for AC to pass</p>
<h4>Capacitor</h4>
<p>Reactance is low but resistance is high ∴ difficult for DC to pass</p>
