<h4>Euler's number (e)</h4>
<p>2.71828</p>
<h4>Types of curves</h4>
<p>Hyperbola, parabola, +ve exponential, -ve exponential (build-up/wash-in) (?)</p>
<h4>Log transform → straight line</h4>
<ul>
<li>y = e^kt</li>
<li>ln y = ln(e^kt)</li>
<li>ln y = kt.ln(e)</li>
<li>ln y = kt.1</li>
<li>ln y = kt</li>
</ul>
