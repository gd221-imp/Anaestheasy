<p>Coombs classification</p>
<h4>Type I</h4>
<p>Allergy - IgE - e.g. Anaphylaxis - Immediate</p>
<p>Type II - Cytotoxic - IgM/IgG - e.g. Goodpasture's syndrome</p>
<p>Type III - Immune complex - IgG - e.g. Rheumatoid arthritis</p>
<p>Type IV - Cell mediated - Lymphocytes - e.g. Transplant rejection - Delayed</p>
