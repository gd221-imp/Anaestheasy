name: Check and build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-content:
    name: Content and house rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check content and house rules
        run: python3 tools/check.py

  spell-check:
    name: UK Medical spell check (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run UK Medical & British English spell check
        uses: streetsidesoftware/cspell-action@v6
        with:
          config: cspell.json
          incremental_files_only: true
          strict: true
          inline: warning

  build-preview:
    name: Build application and artifact
    needs: check-content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the app
        run: python3 tools/build.py
      - name: Save the built app (download from this run to preview)
        uses: actions/upload-artifact@v4
        with:
          name: pathway-preview
          path: dist/index.html
      - name: Prepare preview site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  check:
    name: Check (Overall status)
    if: always()
    needs: [check-content, spell-check, build-preview]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks passed
        run: |
          if [ "${{ needs.check-content.result }}" != "success" ]; then
            echo "Error: check-content failed" >&2
            exit 1
          fi
          if [ "${{ needs.build-preview.result }}" != "success" ]; then
            echo "Error: build-preview failed" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.spell-check.result }}" != "success" ]; then
            echo "Error: spell-check failed on pull request" >&2
            exit 1
          fi
          echo "All required checks passed successfully."

  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # stays green until GitHub Pages is switched on (Settings > Pages > GitHub Actions)
